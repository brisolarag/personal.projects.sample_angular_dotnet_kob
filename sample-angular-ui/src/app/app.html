<div class="min-h-screen bg-gray-50 font-sans text-gray-800">

  <aside class="fixed top-0 left-0 z-40 w-64 h-screen border-r border-gray-200 bg-white p-6 overflow-y-auto">
    
    <div 
      class="mb-8 font-bold text-xl transition-colors duration-300"
      [ngClass]="stateService.mode() === 'workout' ? 'text-indigo-600' : 'text-green-600'"
    >
      Dietador
    </div>

    <nav class="space-y-4">
      <button 
        *ngFor="let i of dayIndices" 
        (click)="selectDay(i)"
        class="w-full py-3 px-4 rounded-xl text-center transition-all duration-200 border shadow-sm"
        [ngClass]="{
          'text-white shadow-md transform scale-105': stateService.selectedDayIndex() === i,
          'bg-indigo-600 border-indigo-600': stateService.selectedDayIndex() === i && stateService.mode() === 'workout',
          'bg-green-600 border-green-600': stateService.selectedDayIndex() === i && stateService.mode() === 'diet',

          'bg-white text-gray-600 border-gray-300': stateService.selectedDayIndex() !== i,
          'hover:bg-indigo-50 hover:border-indigo-300': stateService.selectedDayIndex() !== i && stateService.mode() === 'workout',
          'hover:bg-green-50 hover:border-green-300': stateService.selectedDayIndex() !== i && stateService.mode() === 'diet'
        }"
      >
        {{ langService.t().sidebar.days[i] }}
      </button>
    </nav>
  </aside>


  <main class="ml-64 p-8 relative min-h-screen">

    <div class="fixed top-6 right-8 z-50">
      <div class="relative">
        <button (click)="toggleProfile()" class="h-12 w-12 rounded-full bg-gray-200 border-2 border-white shadow-sm flex items-center justify-center hover:ring-2 hover:ring-indigo-500 transition-all focus:outline-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </button>
        <div *ngIf="isProfileOpen" class="absolute right-0 mt-3 w-64 bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden origin-top-right animate-fade-in-down">
            <div class="px-4 py-3 border-b border-gray-100 bg-gray-50"><p class="text-sm font-semibold text-gray-800">My Profile</p></div>
            <div class="p-2 space-y-1">
                <div class="flex items-center justify-between px-3 py-2 rounded-lg hover:bg-gray-50">
                <span class="text-sm font-medium text-gray-600 flex items-center gap-2">Language</span>
                <button (click)="langService.toggleLanguage(); $event.stopPropagation()" class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none" [class.bg-green-500]="langService.t().sidebar.days[0] === 'Segunda'" [class.bg-gray-300]="langService.t().sidebar.days[0] !== 'Segunda'">
                    <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform duration-200 ml-1" [class.translate-x-5]="langService.t().sidebar.days[0] === 'Segunda'" [class.translate-x-0]="langService.t().sidebar.days[0] !== 'Segunda'"></span>
                </button>
                </div>
                <div class="text-xs text-right px-3 pb-1 text-gray-400">{{ langService.t().sidebar.days[0] === 'Segunda' ? 'Português' : 'English' }}</div>
            </div>
        </div>
      </div>
    </div>

    <router-outlet></router-outlet>

  </main>


  <div class="fixed bottom-8 left-1/2 transform -translate-x-1/2 z-50 ml-32">
    <div class="bg-white border border-gray-200 shadow-lg rounded-full p-1 flex space-x-1">
      
      <a 
        routerLink="/workout" 
        routerLinkActive
        #rlaWorkout="routerLinkActive"
        [ngClass]="rlaWorkout.isActive ? 
          'bg-indigo-600 text-white shadow-md' : 
          'text-gray-600 hover:bg-gray-100'"
        class="px-8 py-2 rounded-full font-medium transition-colors cursor-pointer"
      >
        {{ langService.t().nav.workout }}
      </a>

      <a 
        routerLink="/diet"
        routerLinkActive
        #rlaDiet="routerLinkActive"
        [ngClass]="rlaDiet.isActive ? 
          'bg-green-600 text-white shadow-md' : 
          'text-gray-600 hover:bg-gray-100'"
        class="px-8 py-2 rounded-full font-medium transition-colors cursor-pointer"
      >
        {{ langService.t().nav.diet }}
      </a>

    </div>
  </div>

</div>
